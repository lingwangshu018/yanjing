name: Apply MCP Settings Patch

on:
  push:
    branches:
      - feature/mcp-settings
    paths:
      - tools/apply_mcp_settings.py
      - .github/workflows/apply-mcp-settings.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/mcp-settings
          fetch-depth: 0

      - name: Apply MCP settings patch
        run: python tools/apply_mcp_settings.py

      - name: Validate JavaScript
        run: |
          node --check main.js
          node --check mcpClient.js

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add configurable MCP settings" || exit 0
          git push origin HEAD:feature/mcp-settings
